<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Congreso Nacional ANEFS - Melide 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --futsal-blue: #0052CC;        
            --futsal-orange: #FF5500;      
            --futsal-card-bg: rgba(255, 255, 255, 0.94); 
            --text-main: #0F172A;          
            --font-title: 'Montserrat', sans-serif;
            --font-body: 'Rubik', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; font-family: var(--font-body); }
        body { background-color: #0f52ba; display: flex; flex-direction: column; }
        .app-page { display: none; width: 100%; height: 100%; flex-direction: column; position: absolute; top: 0; left: 0; z-index: 2; }
        .app-page.active { display: flex; }
        
        .app-header {
            background: linear-gradient(135deg, rgba(0, 82, 204, 0.98) 0%, rgba(0, 44, 115, 0.98) 100%);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 4px solid var(--futsal-orange);
            color: white;
        }

        .logo-placeholder {
            width: 46px; height: 46px; background-color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--futsal-orange); overflow: hidden;
        }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: cover; }

        .content-area { flex-grow: 1; padding: 24px 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .page-title { font-family: var(--font-title); font-size: 22px; font-weight: 800; color: #FFFFFF; margin-bottom: 20px; }

        .btn-happy {
            background: linear-gradient(135deg, var(--futsal-orange) 0%, #E64A00 100%);
            color: white; padding: 15px 28px; border-radius: 14px; text-decoration: none;
            font-family: var(--font-title); font-weight: 800; font-size: 14px;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: none; cursor: pointer;
        }

        .btn-back { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); color: white; padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; }
        .menu-card { background: var(--futsal-card-bg); border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; }
        .menu-card i { font-size: 20px; color: white; background: var(--futsal-blue); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .menu-card h3 { font-size: 16px; color: var(--text-main); font-weight: 700; }

        .diptico-box { display: flex; align-items: center; justify-content: space-between; background: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; border-left: 4px solid var(--futsal-orange); }
        .diptico-box span { font-weight: 700; font-size: 14px; color: var(--text-main); display: flex; align-items: center; }
        .btn-pdf-link { background-color: #E74C3C; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="app-page active" id="page-welcome">
        <div class="app-header">
            <div class="logo-placeholder"><img src="./logo_anefs.png.png" alt="Logo"></div>
            <div style="flex-grow:1;">
                <h2 style="font-size:14px;">ANEFS FÚTBOL SALA</h2>
            </div>
        </div>
        <div class="content-area" style="text-align: center; justify-content: center; align-items: center; gap: 40px;">
            <div style="background: var(--futsal-blue); color: white; padding: 20px; border-radius: 16px; font-weight: 800; font-size: 22px; width: 100%;">
                XXVII Congreso Nacional <br><span style="color: var(--futsal-orange);">Melide 2026</span>
            </div>
            <button onclick="irAPagina('page-main-menu')" class="btn-happy" style="width: 100%;">Entrar a la Guía <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <div class="app-page" id="page-main-menu">
        <div class="app-header">
            <div class="logo-placeholder"><img src="./logo_anefs.png.png" alt="Logo"></div>
            <div style="flex-grow:1;"><h2 style="font-size:14px;">MENÚ PRINCIPAL</h2></div>
        </div>
        <div class="content-area">
            <div onclick="irAPagina('page-info-melide')" class="menu-card">
                <i class="fa-solid fa-map-location-dot"></i>
                <h3>Dípticos e Información de Melide</h3>
            </div>
        </div>
    </div>

    <div class="app-page" id="page-info-melide">
        <div class="app-header">
            <div class="logo-placeholder"><img src="./logo_anefs.png.png" alt="Logo"></div>
            <div style="flex-grow:1;"><h2 style="font-size:14px;">DESCARGAS</h2></div>
            <button onclick="irAPagina('page-main-menu')" class="btn-back">Menú</button>
        </div>
        <div class="content-area">
            <h2 class="page-title">Descarga tus PDFs:</h2>
            
            <div class="diptico-box">
                <span><i class="fa-solid fa-file-pdf" style="color:#e74c3c; margin-right:6px;"></i> Guía de Melide</span>
                <a href="./guia_melide.pdf" target="_blank" class="btn-pdf-link">Abrir</a>
            </div>
            
            <div class="diptico-box">
                <span><i class="fa-solid fa-file-pdf" style="color:#e74c3c; margin-right:6px;"></i> Un día en Melide</span>
                <a href="./un_dia_en_melide.pdf" target="_blank" class="btn-pdf-link">Abrir</a>
            </div>
            
            <div class="diptico-box">
                <span><i class="fa-solid fa-file-pdf" style="color:#e74c3c; margin-right:6px;"></i> Rueiro - Callejero</span>
                <a href="./rueiro _melide.pdf" target="_blank" class="btn-pdf-link">Abrir</a>
            </div>
        </div>
    </div>

</body>
<script>
    function irAPagina(idPaginaDestino) {
        const paginas = document.querySelectorAll('.app-page');
        paginas.forEach(pag => pag.classList.remove('active'));
        document.getElementById(idPaginaDestino).classList.add('active');
    }
</script>
</html>
